<div class="quiz__container">
    <div class="quiz__logo">
        <img src="assets/imgs/logo.png" alt="Logo do Buzzfeed">
        <h1>{{title}}</h1>
    </div>

    <div *ngIf=!finished class="quiz__questions">
        <h4>{{questionSelected.question}}</h4>
    </div>

    <div *ngIf=!finished class="quiz__options">
        <button *ngFor="let option of questionSelected.options"
        (click)="playerChoice(option.alias)"
        class="btn-option">{{option.name}}</button>
    </div>

    <div *ngIf=finished class="quiz__results">
        <h1>O seu resultado é:</h1>
        <p>{{answerSelected}}</p>
    </div>
</div>
